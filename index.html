<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Pencatatan Keuangan</title>
  <style>
    /* Reset Dasar & Tema Gelap */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card Login */
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .card h2 {
      margin-bottom: 20px;
      color: #ffffff;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #b0b0b0;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background-color: #2b2b2b;
      border: 1px solid #444444;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-control:focus {
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    /* Panel Hasil Login Admin */
    #adminPanel {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #1b382b;
      border: 1px solid #2e6d4e;
      border-radius: 8px;
      color: #a7f3d0;
      text-align: center;
    }

    /* ===================================================
       STYLING ANIMASI LOADING SPINNER (OVERLAY)
       =================================================== */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75); /* Latar transparan gelap */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #loadingOverlay.active {
      visibility: visible;
      opacity: 1;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #333333;
      border-top: 5px solid #3b82f6; /* Warna aksen biru berputar */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 15px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Container Form Login -->
  <div class="card">
    <h2>Masuk Admin</h2>
    
    <div class="form-group">
      <label for="adminPassword">Kata Sandi Admin</label>
      <input type="password" id="adminPassword" class="form-control" placeholder="Masukkan kata sandi...">
    </div>
    
    <button class="btn" onclick="loginAdmin()">Masuk</button>

    <!-- Panel sukses masuk Admin -->
    <div id="adminPanel">
      ✔ Berhasil masuk sebagai Admin!
    </div>
  </div>

  <!-- Component Loading Overlay dengan Animasi Spinner -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memverifikasi Admin...</div>
  </div>

  <script>
    function loginAdmin() {
      var passwordInput = document.getElementById('adminPassword').value;

      if (!passwordInput) {
        alert("Silakan masukkan kata sandi terlebih dahulu!");
        return;
      }

      // 1. Tampilkan animasi loading
      showLoading(true, "Memverifikasi hak akses Admin...");

      // 2. Panggil fungsi di server Apps Script
      google.script.run
        .withSuccessHandler(function(response) {
          // 3. Matikan animasi loading setelah respon balik diterima
          showLoading(false);

          if (response && response.success) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('adminPassword').value = '';
          } else {
            alert(response.message || "Kata sandi salah!");
          }
        })
        .withFailureHandler(function(error) {
          showLoading(false);
          alert("Terjadi kesalahan sistem: " + error.message);
        })
        .checkAdminPassword(passwordInput); // Fungsi yang dipanggil di Code.gs
    }

    // Fungsi pembantu untuk mengontrol aktif/matinya animasi loading
    function showLoading(isLoading, text) {
      var overlay = document.getElementById('loadingOverlay');
      var loadingText = document.getElementById('loadingText');

      if (isLoading) {
        if (text) loadingText.innerText = text;
        overlay.classList.add('active');
      } else {
        overlay.classList.remove('active');
      }
    }
  </script>
</body>
</html>
