<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <link rel="manifest" href="/manifest.json">

  <!-- Meta Tag Fullscreen & Status Bar -->
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kas Rohis">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

  <title>Pencatatan Keuangan Organisasi</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --card-border: #1e293b;
      --input-bg: #1e293b;
      --input-border: #334155;
      --accent-pemasukan: #10b981;
      --accent-pengeluaran: #f43f5e;
      --accent-primary: #6366f1;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      font-family: 'Outfit', -apple-system, sans-serif;
      color: #f8fafc;
      font-size: 0.88rem;

      /* Safe Area Inset untuk PWA Fullscreen */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .wallet-card {
      background: linear-gradient(135deg, #3730a3 0%, #5b21b6 100%);
      border-radius: 18px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
    }

    .wallet-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .stat-box {
      padding: 1rem;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
    }

    .stat-val {
      font-size: clamp(1.1rem, 3.2vw, 1.45rem);
      font-weight: 700;
      word-break: break-word;
    }

    .form-control, .form-select, .input-group-text {
      background-color: var(--input-bg) !important;
      border: 1px solid var(--input-border) !important;
      color: #f8fafc !important;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .form-control:focus, .form-select:focus,
    .form-control:active, .form-select:active,
    .form-control:valid, .form-select:valid {
      background-color: var(--input-bg) !important;
      color: #f8fafc !important;
      border-color: #818cf8 !important;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25) !important;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active,
    select:-webkit-autofill,
    select:-webkit-autofill:hover,
    select:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #1e293b inset !important;
      -webkit-text-fill-color: #f8fafc !important;
      caret-color: #f8fafc !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .form-select option {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }

    .form-control::placeholder {
      color: #64748b !important;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background-color: #334155 !important;
      color: #f8fafc !important;
      border: none !important;
      padding: 0.2rem 0.6rem !important;
      border-radius: 6px !important;
      margin-right: 8px !important;
    }

    .is-invalid {
      border-color: #f43f5e !important;
      background-image: none !important;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.35) !important;
    }

    .shake {
      animation: shakeAnim 0.4s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #64748b;
      background-color: transparent;
      transition: all 0.2s ease;
    }
    .pin-dot.active {
      background-color: #818cf8;
      border-color: #818cf8;
      box-shadow: 0 0 10px rgba(129, 140, 248, 0.6);
    }
    .pin-dot.error {
      background-color: #f43f5e;
      border-color: #f43f5e;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 240px;
      margin: 0 auto;
    }
    .keypad-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #f8fafc;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .keypad-btn:active {
      background: #334155;
      transform: scale(0.92);
    }
    .keypad-btn.action {
      background: transparent;
      border: none;
      color: #94a3b8;
    }
    .keypad-btn.action:active {
      color: #f8fafc;
    }

    .table-dark-custom {
      color: #cbd5e1;
      background-color: transparent;
    }

    .table-dark-custom th {
      background-color: #0f172a !important;
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem;
    }

    .table-dark-custom td {
      background-color: transparent !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.85rem;
      color: #f1f5f9;
    }

    .badge-masuk {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.3em 0.7em;
      border-radius: 8px;
    }

    .badge-keluar {
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      padding: 0.3em 0.7em;
      border-radius: 8px;
    }

    .swal2-popup-dark {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155 !important;
      border-radius: 16px !important;
    }
    .swal2-popup-dark .swal2-title {
      color: #ffffff !important;
    }

    .swal2-popup-logout {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155 !important;
      border-radius: 16px !important;
    }
    .swal2-popup-logout .swal2-title,
    .swal2-popup-logout .swal2-html-container {
      color: #ffffff !important;
    }
    .swal2-popup-logout .swal2-icon.swal2-error {
      border-color: #f43f5e !important;
      color: #f43f5e !important;
    }
    .swal2-popup-logout .swal2-icon.swal2-error [class^='swal2-x-mark-line'] {
      background-color: #f43f5e !important;
    }

    @media (max-width: 576px) {
      .container {
        padding-left: 10px;
        padding-right: 10px;
      }
      .wallet-card {
        padding: 1.1rem;
      }
    }
  </style>
</head>
<body class="pb-5">

    <div class="container">
      <div class="d-flex align-items-center">
        <div class="p-2 rounded-3 me-2 text-white bg-indigo bg-opacity-25 border border-white border-opacity-10 d-flex align-items-center justify-content-center" style="width:38px; height:38px; background: rgba(99, 102, 241, 0.2);">

        <div>

      </div>

      <div class="col-12 col-md-5">
        <div class="wallet-card h-100 d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="text-white-50 small uppercase">Saldo Akhir Tersedia</span>

            </span>

      <div class="col-12 col-md-7">
        <div class="glass-card p-3 h-100 d-flex flex-column justify-content-center">

                  </div>

    <div id="secForm" class="glass-card p-3 p-md-4 mb-4 d-none">
      <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary border-opacity-25 pb-2">

      <form id="formTransaksi" onsubmit="handleSimpan(event)" novalidate>

            <label class="form-label small text-secondary mb-1">Tanggal *</label>
            <input type="date" id="tanggal" class="form-control nav-enter" oninput="hapusTandaEror(this)" required>
          </div>

          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary mb-1">Jenis Transaksi *</label>
            <select id="jenis" class="form-select nav-enter" onchange="hapusTandaEror(this)" required>
              <option value="" selected disabled>-- Pilih Jenis --</option>
              <option value="Pemasukan">Pemasukan</option>

            </select>

          <div class="col-12 col-md-3">
            <label class="form-label small text-secondary mb-1">Kategori *</label>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {

          .then(function (reg) {

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGzXDHtxoeuL_QZqE--XAzRdTZDB_MHSOI-LZpaws0uzvt9neNHl1hkgri0g40u1l5Xg/exec";

    // Pengaturan kompresi gambar nota
    const KOMPRES_MAX_DIMENSI = 1280; // px, sisi terpanjang
    const KOMPRES_KUALITAS = 0.7;     // 0 - 1 (kualitas JPEG)

    let rawDataTransaksi = [];
    let activeUsername = null;
    let activePin = null;
    let currentPin = "";

    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
      cekSesiLogin();
      muatData();
      inisiatorPindahEnter();
      inisiatorEnterUsername();
    });

    function cekSesiLogin() {
      const savedUser = localStorage.getItem('kas_admin_user');
      const savedPin = localStorage.getItem('kas_admin_pin');

      if (savedUser && savedPin) {
        activeUsername = savedUser;
        activePin = savedPin;
        setTampilanLogin(savedUser);
      }
    }

    function setTampilanLogin(username) {
      document.getElementById('statusLogin').className = "badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-25 px-2 py-1";
      document.getElementById('statusLogin').innerHTML = `<i class="fa-solid fa-user-check me-1"></i>Admin: ${username}`;
      document.getElementById('btnAuth').innerHTML = `<i class="fa-solid fa-right-from-bracket me-1"></i>Logout`;
      document.getElementById('secForm').classList.remove('d-none');
      document.getElementById('btnTambahAkun').classList.remove('d-none');
    }

    function inisiatorEnterUsername() {
      const userInput = document.getElementById('userInput');
      if (userInput) {
        userInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            userInput.blur();
          }
        });
      }
    }

    function inisiatorPindahEnter() {
      const inputsForm = Array.from(document.querySelectorAll('#formTransaksi .nav-enter'));
      inputsForm.forEach((element, index) => {
        element.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            const nextInput = inputsForm[index + 1];
            if (nextInput) {
              nextInput.focus();
            } else {
              document.getElementById('btnSimpan').click();
            }
          }
        });
      });
    }

    function pressPin(digit) {
      if (currentPin.length < 6) {
        currentPin += digit;
        updatePinDots();
        if (currentPin.length === 6) {
          setTimeout(() => {
            prosesLogin();
          }, 150);
        }
      }
    }

    function backspacePin() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updatePinDots();
      }
    }

    function clearPin() {
      currentPin = "";
      updatePinDots();
    }

    function updatePinDots(isError = false) {
      const dots = document.querySelectorAll('#pinDotsGroup .pin-dot');
      dots.forEach((dot, index) => {
        dot.className = "pin-dot";
        if (isError) {
          dot.classList.add('error');
        } else if (index < currentPin.length) {
          dot.classList.add('active');
        }
      });
    }

    document.addEventListener('keydown', function(e) {
      const modalAuth = document.getElementById('modalAuth');
      if (modalAuth && modalAuth.classList.contains('show')) {
        if (document.activeElement.id === 'userInput') return;

        if (e.key >= '0' && e.key <= '9') {
          pressPin(e.key);
        } else if (e.key === 'Backspace') {
          backspacePin();
        } else if (e.key === 'Escape' || e.key === 'Delete') {
          clearPin();
        }
      }
    });

    function hapusTandaEror(el) {
      if (el.classList.contains('is-invalid')) {
        el.classList.remove('is-invalid');
      }
      if (el.classList.contains('shake')) {
        el.classList.remove('shake');
      }
    }

    function berikanEfekError(el) {
      el.classList.add('is-invalid');
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    }

    function berikanEfekErrorPin() {
      const container = document.getElementById('pinDotsGroup');
      updatePinDots(true);
      container.classList.remove('shake');
      void container.offsetWidth;
      container.classList.add('shake');
      setTimeout(() => {
        clearPin();
      }, 600);
    }

    function formatRupiahInput(el) {
      let val = el.value.replace(/\D/g, '');
      el.value = val ? Number(val).toLocaleString('id-ID') : '';
    }

    function formatRupiah(angka) {
      return "Rp " + Number(angka).toLocaleString('id-ID');
    }

    // ===== Kompresi gambar nota sebelum diupload =====
    // Hanya berlaku untuk file bertipe image/*; PDF dilewati apa adanya
    // karena kompresi PDF butuh library tambahan.
    function compressImage(file, maxDimensi = KOMPRES_MAX_DIMENSI, kualitas = KOMPRES_KUALITAS) {
      return new Promise((resolve, reject) => {
        const readerAwal = new FileReader();
        readerAwal.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            let { width, height } = img;

            if (width > maxDimensi || height > maxDimensi) {
              if (width > height) {
                height = Math.round(height * (maxDimensi / width));
                width = maxDimensi;
              } else {
                width = Math.round(width * (maxDimensi / height));
                height = maxDimensi;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Isi background putih dulu (mencegah PNG transparan jadi hitam saat jadi JPEG)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(function(blob) {
              if (!blob) {
                reject(new Error('Gagal mengompres gambar'));
                return;
              }
              const namaBaru = file.name.replace(/\.[^.]+$/, '') + '.jpg';
              const fileHasil = new File([blob], namaBaru, { type: 'image/jpeg' });
              resolve(fileHasil);
            }, 'image/jpeg', kualitas);
          };
          img.onerror = function() {
            reject(new Error('Gagal membaca gambar'));
          };
          img.src = e.target.result;
        };
        readerAwal.onerror = function() {
          reject(new Error('Gagal membaca file'));
        };
        readerAwal.readAsDataURL(file);
      });
    }

    function toggleAuthModal() {
      if (activeUsername) {
        activeUsername = null;
        activePin = null;
        localStorage.removeItem('kas_admin_user');
        localStorage.removeItem('kas_admin_pin');

        document.getElementById('statusLogin').className = "badge bg-dark text-secondary border border-secondary px-2 py-1";
        document.getElementById('statusLogin').innerHTML = `<i class="fa-solid fa-user me-1"></i>Tamu`;
        document.getElementById('btnAuth').innerHTML = `<i class="fa-solid fa-right-to-bracket me-1"></i>Login Admin`;
        document.getElementById('secForm').classList.add('d-none');
        document.getElementById('btnTambahAkun').classList.add('d-none');

        Swal.fire({
          icon: 'error',
          title: 'Logout',
          text: 'Anda telah keluar dari mode Admin.',
          timer: 1500,
          showConfirmButton: false,
          customClass: { popup: 'swal2-popup-logout' }
        });
      } else {
        const modalEl = document.getElementById('modalAuth');
        const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
        modal.show();
        clearPin();
        setTimeout(() => document.getElementById('userInput').focus(), 400);
      }
    }

    function prosesLogin() {
      const uEl = document.getElementById('userInput');
      const u = uEl.value.trim().toLowerCase();
      const p = currentPin;

      let hasError = false;
      if (!u) { berikanEfekError(uEl); hasError = true; }
      if (!p || p.length !== 6) { berikanEfekErrorPin(); hasError = true; }

      if (hasError) return;

      Swal.fire({
        title: 'Memverifikasi Admin...',
        text: 'Mohon tunggu sebentar',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        customClass: { popup: 'swal2-popup-dark' },
        didOpen: () => {
          Swal.showLoading();
        }
      });

      const payload = {
        action: "verifikasiAdmin",
        username: u,
        pin: p
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          activeUsername = u;
          activePin = p;

          localStorage.setItem('kas_admin_user', u);
          localStorage.setItem('kas_admin_pin', p);

          setTampilanLogin(u);

          const modalEl = document.getElementById('modalAuth');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();

          uEl.value = '';
          clearPin();

          Swal.fire({
            icon: 'success',
            title: 'Berhasil Login',
            text: 'Selamat datang kembali, Admin!',
            timer: 1500,
            showConfirmButton: false,
            customClass: { popup: 'swal2-popup-dark' }
          });
          setTimeout(() => document.getElementById('tanggal').focus(), 500);
        } else {
          berikanEfekError(uEl);
          berikanEfekErrorPin();
          Swal.fire({
            icon: 'error',
            title: 'Gagal Login',
            text: res.message,
            customClass: { popup: 'swal2-popup-dark' }
          });
        }
      })
      .catch(err => {
        console.error("Error login:", err);
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Terjadi kesalahan koneksi.',
          customClass: { popup: 'swal2-popup-dark' }
        });
      });
    }

    function bukaModalTambahAkun() {
      if (!activeUsername || !activePin) {
        Swal.fire({
          icon: 'warning',
          title: 'Akses Ditolak',
          text: 'Silakan login Admin terlebih dahulu.',
          customClass: { popup: 'swal2-popup-dark' }
        });
        return;
      }
      document.getElementById('formTambahAkun').reset();
      const modalEl = document.getElementById('modalTambahAkun');
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }

    function handleTambahAkun(e) {
      e.preventDefault();

      const userEl = document.getElementById('akunUsername');
      const pinEl = document.getElementById('akunPin');

      const usernameBaru = userEl.value.trim();
      const pinBaru = pinEl.value.trim();

      let hasError = false;
      if (!usernameBaru) { berikanEfekError(userEl); hasError = true; }
      if (!/^\d{6}$/.test(pinBaru)) { berikanEfekError(pinEl); hasError = true; }

      if (hasError) {
        if (!/^\d{6}$/.test(pinBaru)) {
          Swal.fire({
            icon: 'warning',
            title: 'PIN Tidak Valid',
            text: 'PIN harus terdiri dari 6 angka.',
            customClass: { popup: 'swal2-popup-dark' }
          });
        }
        return;
      }

      const btn = document.getElementById('btnSimpanAkun');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin me-1"></i> Menyimpan...`;

      const payload = {
        action: "tambahAkun",
        data: {
          requesterUsername: activeUsername,
          requesterPin: activePin,
          username: usernameBaru,
          pin: pinBaru
        }
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-1"></i>Buat Akun`;

        if (res.success) {
          const modalEl = document.getElementById('modalTambahAkun');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();

          Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: res.message,
            timer: 1800,
            showConfirmButton: false,
            customClass: { popup: 'swal2-popup-dark' }
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Gagal',
            text: res.message,
            customClass: { popup: 'swal2-popup-dark' }
          });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-1"></i>Buat Akun`;
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Terjadi kesalahan koneksi: ' + err.message,
          customClass: { popup: 'swal2-popup-dark' }
        });
      });
    }

    function muatData() {
      fetch(`${SCRIPT_URL}?action=ambilData`)
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            rawDataTransaksi = result.data || [];
            filterDanTampilkanData();
          } else {
            throw new Error(result.message);
          }
        })
        .catch(err => {
          console.error("Gagal muat data:", err);
          document.getElementById('tabelBody').innerHTML = `
            <tr><td colspan="6" class="text-center text-danger py-3">Gagal mengambil data dari Google Spreadsheet.</td></tr>
          `;
        });
    }

    function filterDanTampilkanData() {
      const periode = document.getElementById('filterPeriode').value;
      const keyword = document.getElementById('searchKeyword').value.toLowerCase().trim();
      const now = new Date();

      const filteredData = rawDataTransaksi.filter(row => {
        let matchPeriode = true;
        let rawTgl = row[1];
        let tgl;

        if (typeof rawTgl === 'string' && rawTgl.includes('T')) {
          tgl = new Date(rawTgl);
        } else if (typeof rawTgl === 'string' && rawTgl.includes('-')) {
          const parts = rawTgl.split('-');
          if (parts[0].length === 4) {
            tgl = new Date(parts[0], parts[1] - 1, parts[2]);
          } else {
            tgl = new Date(parts[2], parts[1] - 1, parts[0]);
          }
        } else {
          tgl = new Date(rawTgl);
        }

        if (!isNaN(tgl.getTime())) {
          if (periode === 'minggu') {
            const selisihHari = (now - tgl) / (1000 * 60 * 60 * 24);
            matchPeriode = selisihHari >= 0 && selisihHari <= 7;
          } else if (periode === 'bulan') {
            matchPeriode = tgl.getMonth() === now.getMonth() && tgl.getFullYear() === now.getFullYear();
          } else if (periode === 'tahun') {
            matchPeriode = tgl.getFullYear() === now.getFullYear();
          }
        }

        let matchKeyword = true;
        if (keyword) {
          const textRow = ((row[2] || "") + " " + (row[3] || "") + " " + (row[5] || "")).toLowerCase();
          matchKeyword = textRow.includes(keyword);
        }

        return matchPeriode && matchKeyword;
      });

      tampilkanData(filteredData);
      updateRingkasan(filteredData);
    }

    function tampilkanData(data) {
      const tbody = document.getElementById('tabelBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center text-secondary py-4">
              Tidak ada riwayat transaksi kas yang ditemukan.
            </td>
          </tr>`;
        return;
      }

      data.forEach(row => {
        const isPemasukan = row[2] === 'Pemasukan';
        const badgeClass = isPemasukan ? 'badge-masuk' : 'badge-keluar';
        const nominalFormatted = formatRupiah(row[4] || 0);

        let tglDisplay = row[1];
        if (tglDisplay && typeof tglDisplay === 'string' && tglDisplay.includes('T')) {
          tglDisplay = tglDisplay.split('T')[0];
        }

        const linkNota = (row[6] && row[6] !== '-')
          ? `<a href="${row[6]}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-light py-0 px-2" style="font-size:0.75rem;"><i class="fa-solid fa-receipt me-1"></i>Nota</a>`
          : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="fw-semibold text-secondary">${tglDisplay || '-'}</td>
          <td><span class="${badgeClass}">${row[2] || '-'}</span></td>
          <td class="text-white">${row[3] || '-'}</td>
          <td class="fw-bold ${isPemasukan ? 'text-emerald' : 'text-rose'}" style="color: ${isPemasukan ? '#34d399' : '#fb7185'};">${nominalFormatted}</td>
          <td class="text-secondary">${row[5] || '-'}</td>
          <td>${linkNota}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateRingkasan(data) {
      let totalMasuk = 0;
      let totalKeluar = 0;

      data.forEach(row => {
        const jml = Number(row[4]) || 0;
        if (row[2] === 'Pemasukan') totalMasuk += jml;
        else if (row[2] === 'Pengeluaran') totalKeluar += jml;
      });

      const saldo = totalMasuk - totalKeluar;

      document.getElementById('txtPemasukan').innerText = formatRupiah(totalMasuk);
      document.getElementById('txtPengeluaran').innerText = formatRupiah(totalKeluar);
      document.getElementById('txtSaldo').innerText = formatRupiah(saldo);

      const badge = document.getElementById('badgeStatusKas');
      if (saldo >= 0) {
        badge.className = "badge bg-success bg-opacity-20 text-white border border-success border-opacity-25";
        badge.innerHTML = `<i class="fa-solid fa-circle-check me-1"></i>Kas Surplus`;
      } else {
        badge.className = "badge bg-danger bg-opacity-20 text-white border border-danger border-opacity-25";
        badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation me-1"></i>Kas Defisit`;
      }
    }

    function handleSimpan(e) {
      e.preventDefault();

      const tglEl = document.getElementById('tanggal');
      const jenisEl = document.getElementById('jenis');
      const katEl = document.getElementById('kategori');
      const jmlEl = document.getElementById('jumlah');
      const ketEl = document.getElementById('keterangan');
      const fileInput = document.getElementById('fotoNota');

      let hasError = false;

      if (!tglEl.value) { berikanEfekError(tglEl); hasError = true; }
      if (!jenisEl.value) { berikanEfekError(jenisEl); hasError = true; }
      if (!katEl.value.trim()) { berikanEfekError(katEl); hasError = true; }
      if (!jmlEl.value.trim()) { berikanEfekError(jmlEl); hasError = true; }
      if (!ketEl.value.trim()) { berikanEfekError(ketEl); hasError = true; }
      if (!fileInput.files.length) { berikanEfekError(fileInput); hasError = true; }

      if (hasError) return;

      if (!activeUsername || !activePin) {
        Swal.fire({
          icon: 'warning',
          title: 'Akses Ditolak',
          text: 'Silakan login Admin terlebih dahulu.',
          customClass: { popup: 'swal2-popup-dark' }
        });
        return;
      }

      if (!navigator.onLine) {
        Swal.fire({
          icon: 'warning',
          title: 'Tidak Ada Koneksi',
          text: 'Transaksi butuh internet. Sambungkan dulu, lalu simpan kembali.',
          customClass: { popup: 'swal2-popup-dark' }
        });
        return;
      }

      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin me-1"></i> Menyimpan...`;

      const file = fileInput.files[0];
      const rawJumlah = jmlEl.value.replace(/\D/g, '');

      const payload = {
        action: "simpanTransaksi",
        data: {
          tanggal: tglEl.value,
          jenis: jenisEl.value,
          kategori: katEl.value.trim(),
          jumlah: Number(rawJumlah),
          keterangan: ketEl.value.trim(),
          usernameAdmin: activeUsername,
          pinAdmin: activePin,
          fileData: null,
          fileName: null,
          fileType: null
        }
      };

      const gagalSimpan = (pesan) => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-1"></i>Simpan Transaksi`;
        Swal.fire({
          icon: 'error',
          title: 'Gagal',
          text: pesan,
          customClass: { popup: 'swal2-popup-dark' }
        });
      };

      const prosesKirim = (dataPayload) => {
        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(dataPayload)
        })
        .then(res => res.json())
        .then(resMsg => {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-floppy-disk me-1"></i>Simpan Transaksi`;

          if (resMsg.success) {
            document.getElementById('formTransaksi').reset();
            document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];

            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: resMsg.message,
              timer: 1500,
              showConfirmButton: false,
              customClass: { popup: 'swal2-popup-dark' }
            });
            muatData();
            setTimeout(() => document.getElementById('tanggal').focus(), 500);
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Gagal',
              text: resMsg.message,
              customClass: { popup: 'swal2-popup-dark' }
            });
          }
        })
        .catch(err => gagalSimpan(err.message));
      };

      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          gagalSimpan('Maksimal ukuran file nota 5MB.');
          return;
        }

        // Sebagian browser/HP tidak selalu mengisi file.type dengan benar,
        // jadi deteksi gambar juga dicek dari ekstensi nama file sebagai cadangan.
        const isGambarTipe = file.type.startsWith('image/');
        const isGambarEkstensi = /\.(jpe?g|png|webp|gif|bmp)$/i.test(file.name);
        const isHeic = /\.(heic|heif)$/i.test(file.name) || file.type === 'image/heic' || file.type === 'image/heif';
        const isGambar = (isGambarTipe || isGambarEkstensi) && !isHeic;

        if (isHeic) {
          console.warn('File HEIC terdeteksi, kompresi dilewati (browser tidak bisa decode HEIC secara native).');
        }

        const prosesFile = isGambar ? compressImage(file) : Promise.resolve(file);

        prosesFile
          .then(fileFinal => {
            const reader = new FileReader();
            reader.onload = function(evt) {
              payload.data.fileData = evt.target.result;
              payload.data.fileName = fileFinal.name;
              payload.data.fileType = fileFinal.type;
              prosesKirim(payload);
            };
            reader.onerror = function() {
              gagalSimpan('Gagal membaca file nota.');
            };
            reader.readAsDataURL(fileFinal);
          })
          .catch(err => {
            console.warn('Kompresi gagal, kirim file asli:', err);
            // Fallback: kalau kompresi gagal, tetap kirim file asli apa adanya
            const reader = new FileReader();
            reader.onload = function(evt) {
              payload.data.fileData = evt.target.result;
              payload.data.fileName = file.name;
              payload.data.fileType = file.type;
              prosesKirim(payload);
            };
            reader.onerror = function() {
              gagalSimpan('Gagal membaca file nota.');
            };
            reader.readAsDataURL(file);
          });
      } else {
        prosesKirim(payload);
      }
    }
  </script>
